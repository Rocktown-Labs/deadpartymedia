name: Web DB Migrate

on:
  push:
    branches:
      - master
    paths:
      - "apps/web/drizzle/**"
      - "apps/web/src/lib/db/schema.ts"
      - "apps/web/drizzle.config.ts"
      - "apps/web/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

concurrency:
  group: web-db-migrate-master
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Drizzle migrations (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm web:test

      - name: Compute Neon branch expiration (2 hours)
        id: neon-expiration
        run: echo "expires_at=$(date -u -d '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch for migration dry-run
        uses: neondatabase/create-branch-action@v6
        id: neon-create-branch
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-migrate-${{ github.run_id }}
          role: neondb_owner
          database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.neon-expiration.outputs.expires_at }}

      - name: Migrate database (dry-run branch)
        env:
          DATABASE_URL: ${{ steps.neon-create-branch.outputs.db_url_pooled }}
        run: pnpm web:db:migrate

      - name: Delete Neon dry-run branch
        if: always() && steps.neon-create-branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon-create-branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_MAIN }}
        run: pnpm web:db:migrate
