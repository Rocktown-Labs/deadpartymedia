name: Build and Deploy Container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/server/**'
      - '.github/workflows/deploy-container.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CONTAINER_SERVICE_NAME: deadpartymedia-api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/server
        run: uv sync

      - name: Run tests
        working-directory: apps/server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          USE_S3: "False"
        run: uv run pytest

  build-and-deploy:
    name: Build and Deploy to Lightsail
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Lightsail container registry login
        id: registry-login
        run: |
          REGISTRY_LOGIN=$(aws lightsail get-container-service-registry-login --region ${{ env.AWS_REGION }})
          REGISTRY_URL=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.username' | cut -d'@' -f2)
          USERNAME=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.username' | cut -d'@' -f1)
          PASSWORD=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.password')
          echo "registry_url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Log in to Lightsail container registry
        run: |
          echo "${{ steps.registry-login.outputs.password }}" | \
          docker login ${{ steps.registry-login.outputs.registry_url }} \
            -u ${{ steps.registry-login.outputs.username }} \
            --password-stdin

      - name: Build Docker image
        working-directory: apps/server
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          REGISTRY_URL="${{ steps.registry-login.outputs.registry_url }}"
          SERVICE_NAME="${{ env.CONTAINER_SERVICE_NAME }}"
          IMAGE_NAME="${REGISTRY_URL}/${SERVICE_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${REGISTRY_URL}/${SERVICE_NAME}:latest"
          
          docker build -t "${IMAGE_NAME}" -t "${LATEST_IMAGE}" .
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Push Docker image
        run: |
          REGISTRY_URL="${{ steps.registry-login.outputs.registry_url }}"
          SERVICE_NAME="${{ env.CONTAINER_SERVICE_NAME }}"
          IMAGE_NAME="${{ env.image_name }}"
          LATEST_IMAGE="${REGISTRY_URL}/${SERVICE_NAME}:latest"
          
          docker push "${IMAGE_NAME}"
          docker push "${LATEST_IMAGE}"

      - name: Get secrets from AWS Secrets Manager
        id: secrets
        run: |
          # Function to get secret value or set empty
          get_secret() {
            local secret_id=$1
            local output_var=$2
            if aws secretsmanager describe-secret --secret-id "$secret_id" --region ${{ env.AWS_REGION }} &>/dev/null; then
              local value=$(aws secretsmanager get-secret-value \
                --secret-id "$secret_id" \
                --region ${{ env.AWS_REGION }} \
                --query SecretString --output text)
              echo "${output_var}=$value" >> $GITHUB_OUTPUT
            else
              echo "${output_var}=" >> $GITHUB_OUTPUT
              echo "Warning: Secret $secret_id not found. $output_var must be set manually." >&2
            fi
          }
          
          # Get database password (try new name first, fallback to old name)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/db-password --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/db-password" "db_password"
          else
            get_secret "deadpartymedia/database/password" "db_password"
          fi
          
          # Get Django SECRET_KEY (try new name first, fallback to old name)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/secret-key --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/secret-key" "secret_key"
          else
            get_secret "deadpartymedia/django/secret-key" "secret_key"
          fi
          
          # Get AWS S3 credentials (try new names first, fallback to old names)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-access-key-id --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/aws-access-key-id" "aws_access_key_id"
          else
            get_secret "deadpartymedia/aws/access-key-id" "aws_access_key_id"
          fi
          
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-secret-access-key --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/aws-secret-access-key" "aws_secret_access_key"
          else
            get_secret "deadpartymedia/aws/secret-access-key" "aws_secret_access_key"
          fi
          
          # Get S3 bucket name (try multiple possible names)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-storage-bucket-name --region ${{ env.AWS_REGION }} &>/dev/null; then
            AWS_BUCKET=$(aws secretsmanager get-secret-value \
              --secret-id deadpartymedia/aws-storage-bucket-name \
              --region ${{ env.AWS_REGION }} \
              --query SecretString --output text)
            echo "aws_storage_bucket_name=$AWS_BUCKET" >> $GITHUB_OUTPUT
          elif aws secretsmanager describe-secret --secret-id deadpartymedia/aws/storage-bucket-name --region ${{ env.AWS_REGION }} &>/dev/null; then
            AWS_BUCKET=$(aws secretsmanager get-secret-value \
              --secret-id deadpartymedia/aws/storage-bucket-name \
              --region ${{ env.AWS_REGION }} \
              --query SecretString --output text)
            echo "aws_storage_bucket_name=$AWS_BUCKET" >> $GITHUB_OUTPUT
          else
            # Use default bucket name if secret doesn't exist
            echo "aws_storage_bucket_name=deadpartymedia-bucket" >> $GITHUB_OUTPUT
          fi

      - name: Get database connection details
        id: database
        run: |
          # Get database details from Lightsail
          set -euo pipefail
          
          DB_INFO=$(aws lightsail get-relational-database \
            --relational-database-name deadpartymediaDB \
            --region ${{ env.AWS_REGION }} \
            --query 'relationalDatabase.{endpoint:masterEndpoint.address,port:masterEndpoint.port,name:masterDatabaseName,user:masterUsername}' \
            --output json)
          
          # Validate that the API call succeeded and returned valid JSON
          if [ -z "$DB_INFO" ] || [ "$DB_INFO" = "null" ]; then
            echo "Error: Failed to retrieve database information from Lightsail" >&2
            exit 1
          fi
          
          # Extract values and validate they are not null or empty
          DB_HOST=$(echo "$DB_INFO" | jq -r '.endpoint // empty')
          DB_PORT=$(echo "$DB_INFO" | jq -r '.port // empty')
          DB_NAME=$(echo "$DB_INFO" | jq -r '.name // empty')
          DB_USER=$(echo "$DB_INFO" | jq -r '.user // empty')
          
          # Validate all required fields are present
          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "null" ]; then
            echo "Error: Database endpoint (DB_HOST) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "null" ]; then
            echo "Error: Database port (DB_PORT) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "null" ]; then
            echo "Error: Database name (DB_NAME) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_USER" ] || [ "$DB_USER" = "null" ]; then
            echo "Error: Database user (DB_USER) is missing or null" >&2
            exit 1
          fi
          
          # Output validated values
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT
          
          echo "✅ Database connection details validated:"
          echo "   Host: $DB_HOST"
          echo "   Port: $DB_PORT"
          echo "   Name: $DB_NAME"
          echo "   User: $DB_USER"

      - name: Deploy to Lightsail Container Service
        run: |
          set -euo pipefail
          
          # Get container service URL for ALLOWED_HOSTS
          SERVICE_NAME="${{ env.CONTAINER_SERVICE_NAME }}"
          AWS_REGION="${{ env.AWS_REGION }}"
          
          CONTAINER_URL=$(aws lightsail get-container-services \
            --service-names "${SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --query 'containerServices[0].url' \
            --output text | sed 's|https://||' || echo "")
          
          # Validate container service URL was retrieved
          if [ -z "$CONTAINER_URL" ] || [ "$CONTAINER_URL" = "null" ] || [ "$CONTAINER_URL" = "None" ]; then
            echo "Error: Failed to retrieve container service URL" >&2
            exit 1
          fi
          
          # Create base deployment JSON with required environment variables
          cat > deployment.json <<EOF
          {
            "containers": {
              "api": {
                "image": "${{ env.image_name }}",
                "environment": {
                  "DJANGO_SETTINGS_MODULE": "config.settings.production",
                  "DB_HOST": "${{ steps.database.outputs.db_host }}",
                  "DB_PORT": "${{ steps.database.outputs.db_port }}",
                  "DB_NAME": "${{ steps.database.outputs.db_name }}",
                  "DB_USER": "${{ steps.database.outputs.db_user }}",
                  "ALLOWED_HOSTS": "api.deadpartymedia.com,deadpartymedia.com,www.deadpartymedia.com,${CONTAINER_URL}",
                  "USE_S3": "True",
                  "AWS_STORAGE_BUCKET_NAME": "${{ steps.secrets.outputs.aws_storage_bucket_name }}",
                  "AWS_S3_REGION_NAME": "us-east-1",
                  "GUNICORN_BIND": "0.0.0.0:8000"
                },
                "ports": {
                  "8000": "HTTP"
                }
              }
            },
            "publicEndpoint": {
              "containerName": "api",
              "containerPort": 8000,
              "healthCheck": {
                "healthyThreshold": 2,
                "unhealthyThreshold": 2,
                "timeoutSeconds": 5,
                "intervalSeconds": 30,
                "path": "/v1/",
                "successCodes": "200"
              }
            }
          }
          EOF
          
          # Add sensitive secrets to environment variables using jq
          # This ensures secrets are properly escaped and added to the JSON
          DB_PASSWORD="${{ steps.secrets.outputs.db_password }}"
          SECRET_KEY="${{ steps.secrets.outputs.secret_key }}"
          AWS_ACCESS_KEY_ID="${{ steps.secrets.outputs.aws_access_key_id }}"
          AWS_SECRET_ACCESS_KEY="${{ steps.secrets.outputs.aws_secret_access_key }}"
          
          # Validate required secrets
          if [ -z "$DB_PASSWORD" ]; then
            echo "Error: DB_PASSWORD secret not found. Deployment cannot proceed." >&2
            exit 1
          fi
          
          if [ -z "$SECRET_KEY" ]; then
            echo "Error: SECRET_KEY secret not found. Deployment cannot proceed." >&2
            exit 1
          fi
          
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Warning: AWS S3 credentials not found. S3 storage will not work." >&2
            echo "Warning: Consider setting deadpartymedia/aws-access-key-id and deadpartymedia/aws-secret-access-key in Secrets Manager." >&2
          fi
          
          # Apply jq transformations to add required secrets
          # Always add DB_PASSWORD and SECRET_KEY (validated above)
          cat deployment.json | jq \
            --arg db_pwd "$DB_PASSWORD" \
            --arg secret_key "$SECRET_KEY" \
            '.containers.api.environment.DB_PASSWORD = $db_pwd |
             .containers.api.environment.SECRET_KEY = $secret_key' > deployment.json.tmp
          
          # Add AWS credentials only if they exist
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            cat deployment.json.tmp | jq \
              --arg aws_key "$AWS_ACCESS_KEY_ID" \
              --arg aws_secret "$AWS_SECRET_ACCESS_KEY" \
              '.containers.api.environment.AWS_ACCESS_KEY_ID = $aws_key |
               .containers.api.environment.AWS_SECRET_ACCESS_KEY = $aws_secret' > deployment.json
            rm deployment.json.tmp
          else
            mv deployment.json.tmp deployment.json
          fi
          
          # Create new deployment
          aws lightsail create-container-service-deployment \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --cli-input-json file://deployment.json \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to be active..."
          aws lightsail wait container-service-deployment-ready \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --max-attempts 30 \
            --delay 10

      - name: Get service URL
        run: |
          SERVICE_URL=$(aws lightsail get-container-services \
            --service-names ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'containerServices[0].url' \
            --output text)
          echo "Service deployed at: $SERVICE_URL"

