name: Build and Deploy Container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/server/**'
      - '.github/workflows/deploy-container.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CONTAINER_SERVICE_NAME: deadpartymedia-api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/server
        run: uv pip install .

      - name: Run tests
        working-directory: apps/server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: uv run pytest

  build-and-deploy:
    name: Build and Deploy to Lightsail
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Lightsail container registry login
        id: registry-login
        run: |
          REGISTRY_LOGIN=$(aws lightsail get-container-service-registry-login --region ${{ env.AWS_REGION }})
          REGISTRY_URL=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.username' | cut -d'@' -f2)
          USERNAME=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.username' | cut -d'@' -f1)
          PASSWORD=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.password')
          echo "registry_url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Log in to Lightsail container registry
        run: |
          echo "${{ steps.registry-login.outputs.password }}" | \
          docker login ${{ steps.registry-login.outputs.registry_url }} \
            -u ${{ steps.registry-login.outputs.username }} \
            --password-stdin

      - name: Build Docker image
        working-directory: apps/server
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          IMAGE_NAME="${{ steps.registry-login.outputs.registry_url }}/${{ env.CONTAINER_SERVICE_NAME }}:$IMAGE_TAG"
          docker build -t $IMAGE_NAME -t ${{ steps.registry-login.outputs.registry_url }}/${{ env.CONTAINER_SERVICE_NAME }}:latest .
          echo "image_name=$IMAGE_NAME" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker image
        run: |
          docker push ${{ env.image_name }}
          docker push ${{ steps.registry-login.outputs.registry_url }}/${{ env.CONTAINER_SERVICE_NAME }}:latest

      - name: Get secrets from AWS Secrets Manager
        id: secrets
        run: |
          # Get database password from Secrets Manager (if secret exists)
          # Secret name format: deadpartymedia/db-password
          # You can create this secret manually or via Terraform
          if aws secretsmanager describe-secret --secret-id deadpartymedia/db-password --region ${{ env.AWS_REGION }} &>/dev/null; then
            DB_PASSWORD=$(aws secretsmanager get-secret-value \
              --secret-id deadpartymedia/db-password \
              --region ${{ env.AWS_REGION }} \
              --query SecretString --output text)
            echo "db_password=$DB_PASSWORD" >> $GITHUB_OUTPUT
          else
            echo "db_password=" >> $GITHUB_OUTPUT
            echo "Warning: Secret deadpartymedia/db-password not found. DB_PASSWORD must be set manually."
          fi
          
          # Get other secrets if needed (SECRET_KEY, AWS credentials, etc.)
          # Add similar blocks for other secrets

      - name: Get database connection details
        id: database
        run: |
          # Get database details from Lightsail
          DB_INFO=$(aws lightsail get-relational-database \
            --relational-database-name deadpartymediaDB \
            --region ${{ env.AWS_REGION }} \
            --query 'relationalDatabase.{endpoint:masterEndpoint.address,port:masterEndpoint.port,name:masterDatabaseName,user:masterUsername}' \
            --output json)
          
          DB_HOST=$(echo $DB_INFO | jq -r '.endpoint')
          DB_PORT=$(echo $DB_INFO | jq -r '.port')
          DB_NAME=$(echo $DB_INFO | jq -r '.name')
          DB_USER=$(echo $DB_INFO | jq -r '.user')
          
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT

      - name: Deploy to Lightsail Container Service
        run: |
          # Get container service URL for ALLOWED_HOSTS
          CONTAINER_URL=$(aws lightsail get-container-services \
            --service-names ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'containerServices[0].url' \
            --output text | sed 's|https://||')
          
          # Create deployment JSON with environment variables
          cat > deployment.json <<EOF
          {
            "containers": {
              "api": {
                "image": "${{ env.image_name }}",
                "environment": {
                  "DJANGO_SETTINGS_MODULE": "config.settings.production",
                  "DB_HOST": "${{ steps.database.outputs.db_host }}",
                  "DB_PORT": "${{ steps.database.outputs.db_port }}",
                  "DB_NAME": "${{ steps.database.outputs.db_name }}",
                  "DB_USER": "${{ steps.database.outputs.db_user }}",
                  "ALLOWED_HOSTS": "api.deadpartymedia.com,deadpartymedia.com,www.deadpartymedia.com,${CONTAINER_URL}",
                  "USE_S3": "True",
                  "GUNICORN_BIND": "0.0.0.0:8000"
                },
                "ports": {
                  "8000": "HTTP"
                }
              }
            },
            "publicEndpoint": {
              "containerName": "api",
              "containerPort": 8000,
              "healthCheck": {
                "healthyThreshold": 2,
                "unhealthyThreshold": 2,
                "timeoutSeconds": 5,
                "intervalSeconds": 30,
                "path": "/v1/",
                "successCodes": "200"
              }
            }
          }
          EOF
          
          # Add DB_PASSWORD to environment if secret was retrieved
          DB_PASSWORD="${{ steps.secrets.outputs.db_password }}"
          if [ -n "$DB_PASSWORD" ]; then
            # Use jq to add DB_PASSWORD to the deployment JSON
            cat deployment.json | jq --arg pwd "$DB_PASSWORD" '.containers.api.environment.DB_PASSWORD = $pwd' > deployment.json.tmp
            mv deployment.json.tmp deployment.json
          fi
          
          # Create new deployment
          aws lightsail create-container-service-deployment \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --cli-input-json file://deployment.json \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to be active..."
          aws lightsail wait container-service-deployment-ready \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --max-attempts 30 \
            --delay 10

      - name: Get service URL
        run: |
          SERVICE_URL=$(aws lightsail get-container-services \
            --service-names ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'containerServices[0].url' \
            --output text)
          echo "Service deployed at: $SERVICE_URL"

