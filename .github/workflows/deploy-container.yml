name: Build and Deploy Container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/server/**'
      - '.github/workflows/deploy-container.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CONTAINER_SERVICE_NAME: deadpartymedia-api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/server
        run: uv pip install -r pyproject.toml

      - name: Run tests
        working-directory: apps/server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: uv run pytest

  build-and-deploy:
    name: Build and Deploy to Lightsail
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lightsail container registry login
        id: registry-login
        run: |
          REGISTRY_LOGIN=$(aws lightsail get-container-service-registry-login --region ${{ env.AWS_REGION }})
          REGISTRY_URL=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.username' | cut -d'@' -f2)
          USERNAME=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.username' | cut -d'@' -f1)
          PASSWORD=$(echo $REGISTRY_LOGIN | jq -r '.registryLogin.password')
          echo "registry_url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Log in to Lightsail container registry
        run: |
          echo "${{ steps.registry-login.outputs.password }}" | \
          docker login ${{ steps.registry-login.outputs.registry_url }} \
            -u ${{ steps.registry-login.outputs.username }} \
            --password-stdin

      - name: Build Docker image
        working-directory: apps/server
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          IMAGE_NAME="${{ steps.registry-login.outputs.registry_url }}/${{ env.CONTAINER_SERVICE_NAME }}:$IMAGE_TAG"
          docker build -t $IMAGE_NAME -t ${{ steps.registry-login.outputs.registry_url }}/${{ env.CONTAINER_SERVICE_NAME }}:latest .
          echo "image_name=$IMAGE_NAME" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker image
        run: |
          docker push ${{ env.image_name }}
          docker push ${{ steps.registry-login.outputs.registry_url }}/${{ env.CONTAINER_SERVICE_NAME }}:latest

      - name: Deploy to Lightsail Container Service
        run: |
          # Get environment variables from AWS Secrets Manager
          # Note: You'll need to set up secrets in AWS Secrets Manager
          # and retrieve them here, or pass them as GitHub secrets
          
          # Create deployment JSON
          cat > deployment.json <<EOF
          {
            "containers": {
              "api": {
                "image": "${{ env.image_name }}",
                "environment": {
                  "DJANGO_SETTINGS_MODULE": "config.settings.production"
                },
                "ports": {
                  "8000": "HTTP"
                }
              }
            },
            "publicEndpoint": {
              "containerName": "api",
              "containerPort": 8000,
              "healthCheck": {
                "healthyThreshold": 2,
                "unhealthyThreshold": 2,
                "timeoutSeconds": 5,
                "intervalSeconds": 30,
                "path": "/v1/",
                "successCodes": "200"
              }
            }
          }
          EOF
          
          # Create new deployment
          aws lightsail create-container-service-deployment \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --cli-input-json file://deployment.json \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to be active..."
          aws lightsail wait container-service-deployment-ready \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --max-attempts 30 \
            --delay 10

      - name: Get service URL
        run: |
          SERVICE_URL=$(aws lightsail get-container-services \
            --service-names ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'containerServices[0].url' \
            --output text)
          echo "Service deployed at: $SERVICE_URL"

