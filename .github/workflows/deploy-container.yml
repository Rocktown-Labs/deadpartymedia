name: Build and Deploy Container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/server/**'
      - '.github/workflows/deploy-container.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CONTAINER_SERVICE_NAME: deadpartymedia-api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/server
        run: uv sync

      - name: Run tests
        working-directory: apps/server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
          USE_S3: "False"
          SPOTIFY_CLIENT_ID: "test_client_id"
          SPOTIFY_CLIENT_SECRET: "test_client_secret"
        run: uv run pytest

  build-and-deploy:
    name: Build and Deploy to Lightsail
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Validate AWS credentials
      # Required GitHub Secrets:
      # - AWS_ACCESS_KEY_ID: IAM user access key with Lightsail, Secrets Manager permissions
      # - AWS_SECRET_ACCESS_KEY: IAM user secret key
      # See apps/server/IAM_POLICIES.md for required IAM permissions
      - name: Validate AWS credentials
        run: |
          set -euo pipefail
          
          # Debug: Log secret availability (without exposing values)
          echo "::debug::[HYPOTHESIS_A/E] Checking secret availability..."
          HAS_ACCESS_KEY_ID=false
          HAS_SECRET_ACCESS_KEY=false
          
          ACCESS_KEY_ID_VALUE="${{ secrets.AWS_ACCESS_KEY_ID }}"
          SECRET_ACCESS_KEY_VALUE="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          
          if [ -n "$ACCESS_KEY_ID_VALUE" ]; then
            HAS_ACCESS_KEY_ID=true
            ACCESS_KEY_LEN=${#ACCESS_KEY_ID_VALUE}
            echo "::debug::[HYPOTHESIS_A/E] AWS_ACCESS_KEY_ID is present (length: $ACCESS_KEY_LEN)"
          else
            echo "::debug::[HYPOTHESIS_A/E] AWS_ACCESS_KEY_ID is empty or missing"
          fi
          
          if [ -n "$SECRET_ACCESS_KEY_VALUE" ]; then
            HAS_SECRET_ACCESS_KEY=true
            SECRET_KEY_LEN=${#SECRET_ACCESS_KEY_VALUE}
            echo "::debug::[HYPOTHESIS_A/E] AWS_SECRET_ACCESS_KEY is present (length: $SECRET_KEY_LEN)"
          else
            echo "::debug::[HYPOTHESIS_A/E] AWS_SECRET_ACCESS_KEY is empty or missing"
          fi
          
          echo "::debug::[HYPOTHESIS_A/E] Environment context: ${{ github.environment || 'none' }}"
          echo "::debug::[HYPOTHESIS_A/E] Job environment: production"
          echo "::debug::[HYPOTHESIS_A/E] Note: When environment is set, GitHub checks environment secrets first, then repository secrets"
          
          MISSING_SECRETS=()
          
          if [ "$HAS_ACCESS_KEY_ID" = false ]; then
            MISSING_SECRETS+=("AWS_ACCESS_KEY_ID")
          fi
          
          if [ "$HAS_SECRET_ACCESS_KEY" = false ]; then
            MISSING_SECRETS+=("AWS_SECRET_ACCESS_KEY")
          fi
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Error: Missing required GitHub Secrets:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "To fix this:"
            echo "1. Go to your repository: Settings → Secrets and variables → Actions"
            echo "2. For environment 'production': Settings → Environments → production → Secrets"
            echo "3. Add the missing secrets listed above (can be set at repository OR environment level)"
            echo "4. Ensure the IAM user has required permissions (see apps/server/IAM_POLICIES.md)"
            echo "5. Re-run this workflow"
            exit 1
          fi
          
          echo "✅ All required AWS credentials are configured"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        env:
          # Debug: Check if ECR credentials are being auto-configured
          AWS_ECR_REGISTRY: ""

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get ECR registry login (via Lightsail)
        id: registry-login
        run: |
          echo "::debug::[HYPOTHESIS_B/D] Requesting Lightsail container registry login..."
          REGISTRY_LOGIN=$(aws lightsail create-container-service-registry-login --region ${{ env.AWS_REGION }} 2>&1)
          REGISTRY_URL=$(echo "$REGISTRY_LOGIN" | jq -r '.registryLogin.registry')
          USERNAME=$(echo "$REGISTRY_LOGIN" | jq -r '.registryLogin.username')
          PASSWORD=$(echo "$REGISTRY_LOGIN" | jq -r '.registryLogin.password')
          
          echo "::debug::[HYPOTHESIS_B/D] Registry URL: $REGISTRY_URL"
          echo "::debug::[HYPOTHESIS_B/D] Registry URL contains 'ecr': $(echo "$REGISTRY_URL" | grep -i ecr || echo 'no')"
          echo "::debug::[HYPOTHESIS_B/D] Registry URL contains 'lightsail': $(echo "$REGISTRY_URL" | grep -i lightsail || echo 'no')"
          echo "::debug::[HYPOTHESIS_B/D] Full registry login response (sanitized): $(echo "$REGISTRY_LOGIN" | jq -r '.registryLogin | {registry, username, password: "***"}')"
          
          echo "registry_url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Log in to ECR registry
        run: |
          echo "::debug::[HYPOTHESIS_C/D] Attempting Docker login to: ${{ steps.registry-login.outputs.registry_url }}"
          echo "::debug::[HYPOTHESIS_C/D] Checking Docker config before login..."
          cat ~/.docker/config.json 2>/dev/null | jq -r '.auths | keys[]' || echo "::debug::[HYPOTHESIS_C/D] No existing Docker config"
          
          LOGIN_OUTPUT=$(echo "${{ steps.registry-login.outputs.password }}" | \
            docker login ${{ steps.registry-login.outputs.registry_url }} \
              -u ${{ steps.registry-login.outputs.username }} \
              --password-stdin 2>&1) || {
            echo "::error::[HYPOTHESIS_C/D] Docker login failed"
            echo "$LOGIN_OUTPUT"
            exit 1
          }
          
          echo "$LOGIN_OUTPUT"
          echo "::debug::[HYPOTHESIS_C/D] Docker login successful"
          echo "::debug::[HYPOTHESIS_C/D] Docker config after login:"
          cat ~/.docker/config.json 2>/dev/null | jq -r '.auths | keys[]' || echo "::debug::[HYPOTHESIS_C/D] No Docker config found"

      - name: Build Docker image
        working-directory: apps/server
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          REGISTRY_URL="${{ steps.registry-login.outputs.registry_url }}"
          SERVICE_NAME="${{ env.CONTAINER_SERVICE_NAME }}"
          IMAGE_NAME="${REGISTRY_URL}/${SERVICE_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${REGISTRY_URL}/${SERVICE_NAME}:latest"
          
          docker build -t "${IMAGE_NAME}" -t "${LATEST_IMAGE}" .
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Push Docker image
        run: |
          REGISTRY_URL="${{ steps.registry-login.outputs.registry_url }}"
          SERVICE_NAME="${{ env.CONTAINER_SERVICE_NAME }}"
          IMAGE_NAME="${{ env.image_name }}"
          LATEST_IMAGE="${REGISTRY_URL}/${SERVICE_NAME}:latest"
          
          echo "::debug::[HYPOTHESIS_B/C/D] Pushing image: ${IMAGE_NAME}"
          echo "::debug::[HYPOTHESIS_B/C/D] Registry URL format: ${REGISTRY_URL}"
          echo "::debug::[HYPOTHESIS_B/C/D] Checking if registry URL is ECR format..."
          if echo "${REGISTRY_URL}" | grep -qE '\.dkr\.ecr\.|ecr\.amazonaws\.com'; then
            echo "::warning::[HYPOTHESIS_B] Registry URL appears to be ECR format - ECR permissions may be required"
          fi
          
          echo "::debug::[HYPOTHESIS_C/D] Docker config before push:"
          cat ~/.docker/config.json 2>/dev/null | jq -r '.auths | keys[]' || echo "::debug::[HYPOTHESIS_C/D] No Docker config"
          
          docker push "${IMAGE_NAME}" 2>&1 | tee /tmp/docker-push.log || {
            echo "::error::[HYPOTHESIS_B/C/D] Docker push failed"
            echo "::debug::[HYPOTHESIS_B/C/D] Push error details:"
            cat /tmp/docker-push.log
            exit 1
          }
          
          docker push "${LATEST_IMAGE}" 2>&1 | tee /tmp/docker-push-latest.log || {
            echo "::error::[HYPOTHESIS_B/C/D] Docker push (latest) failed"
            echo "::debug::[HYPOTHESIS_B/C/D] Push error details:"
            cat /tmp/docker-push-latest.log
            exit 1
          }
          
          echo "::debug::[HYPOTHESIS_B/C/D] Both images pushed successfully"

      - name: Get secrets from AWS Secrets Manager
        id: secrets
        run: |
          # Function to get secret value or set empty
          get_secret() {
            local secret_id=$1
            local output_var=$2
            if aws secretsmanager describe-secret --secret-id "$secret_id" --region ${{ env.AWS_REGION }} &>/dev/null; then
              local value=$(aws secretsmanager get-secret-value \
                --secret-id "$secret_id" \
                --region ${{ env.AWS_REGION }} \
                --query SecretString --output text)
              echo "${output_var}=$value" >> $GITHUB_OUTPUT
            else
              echo "${output_var}=" >> $GITHUB_OUTPUT
              echo "Warning: Secret $secret_id not found. $output_var must be set manually." >&2
            fi
          }
          
          # Get database password (try new name first, fallback to old name)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/db-password --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/db-password" "db_password"
          else
            get_secret "deadpartymedia/database/password" "db_password"
          fi
          
          # Get Django SECRET_KEY (try new name first, fallback to old name)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/secret-key --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/secret-key" "secret_key"
          else
            get_secret "deadpartymedia/django/secret-key" "secret_key"
          fi
          
          # Get AWS S3 credentials (try new names first, fallback to old names)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-access-key-id --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/aws-access-key-id" "aws_access_key_id"
          else
            get_secret "deadpartymedia/aws/access-key-id" "aws_access_key_id"
          fi
          
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-secret-access-key --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/aws-secret-access-key" "aws_secret_access_key"
          else
            get_secret "deadpartymedia/aws/secret-access-key" "aws_secret_access_key"
          fi
          
          # Get S3 bucket name (try multiple possible names)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-storage-bucket-name --region ${{ env.AWS_REGION }} &>/dev/null; then
            AWS_BUCKET=$(aws secretsmanager get-secret-value \
              --secret-id deadpartymedia/aws-storage-bucket-name \
              --region ${{ env.AWS_REGION }} \
              --query SecretString --output text)
            echo "aws_storage_bucket_name=$AWS_BUCKET" >> $GITHUB_OUTPUT
          elif aws secretsmanager describe-secret --secret-id deadpartymedia/aws/storage-bucket-name --region ${{ env.AWS_REGION }} &>/dev/null; then
            AWS_BUCKET=$(aws secretsmanager get-secret-value \
              --secret-id deadpartymedia/aws/storage-bucket-name \
              --region ${{ env.AWS_REGION }} \
              --query SecretString --output text)
            echo "aws_storage_bucket_name=$AWS_BUCKET" >> $GITHUB_OUTPUT
          else
            # Use default bucket name if secret doesn't exist
            echo "aws_storage_bucket_name=deadpartymedia-bucket" >> $GITHUB_OUTPUT
          fi

      - name: Get database connection details
        id: database
        run: |
          # Get database details from Lightsail
          set -euo pipefail
          
          DB_INFO=$(aws lightsail get-relational-database \
            --relational-database-name deadpartymediaDB \
            --region ${{ env.AWS_REGION }} \
            --query 'relationalDatabase.{endpoint:masterEndpoint.address,port:masterEndpoint.port,name:masterDatabaseName,user:masterUsername}' \
            --output json)
          
          # Validate that the API call succeeded and returned valid JSON
          if [ -z "$DB_INFO" ] || [ "$DB_INFO" = "null" ]; then
            echo "Error: Failed to retrieve database information from Lightsail" >&2
            exit 1
          fi
          
          # Extract values and validate they are not null or empty
          DB_HOST=$(echo "$DB_INFO" | jq -r '.endpoint // empty')
          DB_PORT=$(echo "$DB_INFO" | jq -r '.port // empty')
          DB_NAME=$(echo "$DB_INFO" | jq -r '.name // empty')
          DB_USER=$(echo "$DB_INFO" | jq -r '.user // empty')
          
          # Validate all required fields are present
          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "null" ]; then
            echo "Error: Database endpoint (DB_HOST) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "null" ]; then
            echo "Error: Database port (DB_PORT) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "null" ]; then
            echo "Error: Database name (DB_NAME) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_USER" ] || [ "$DB_USER" = "null" ]; then
            echo "Error: Database user (DB_USER) is missing or null" >&2
            exit 1
          fi
          
          # Output validated values
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT
          
          echo "✅ Database connection details validated:"
          echo "   Host: $DB_HOST"
          echo "   Port: $DB_PORT"
          echo "   Name: $DB_NAME"
          echo "   User: $DB_USER"

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          
          FUNCTION_NAME="deadpartymedia-api"
          AWS_REGION="${{ env.AWS_REGION }}"
          IMAGE_URI="${{ env.image_name }}"
          
          echo "Updating Lambda function: ${FUNCTION_NAME}"
          echo "Image URI: ${IMAGE_URI}"
          
          # Update Lambda function with new image
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            --region "${AWS_REGION}" \
            --output json
          
          echo "✅ Lambda function code updated successfully"
          
          # Wait for function update to complete
          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}"
          
          echo "✅ Lambda function update completed"

      - name: Get Lambda Function URL
        id: lambda_url
        run: |
          FUNCTION_NAME="deadpartymedia-api"
          AWS_REGION="${{ env.AWS_REGION }}"
          
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --query 'FunctionUrl' \
            --output text)
          
          if [ -z "$FUNCTION_URL" ] || [ "$FUNCTION_URL" = "null" ]; then
            echo "Error: Failed to retrieve Lambda Function URL" >&2
            exit 1
          fi
          
          echo "function_url=${FUNCTION_URL}" >> $GITHUB_OUTPUT
          echo "✅ Lambda Function URL: ${FUNCTION_URL}"

      - name: Update Lambda environment variables
        run: |
          set -euo pipefail
          
          FUNCTION_NAME="deadpartymedia-api"
          AWS_REGION="${{ env.AWS_REGION }}"
          FUNCTION_URL="${{ steps.lambda_url.outputs.function_url }}"
          FUNCTION_URL_HOST=$(echo "${FUNCTION_URL}" | sed 's|https://||' | sed 's|/.*||')
          
          # Get current environment variables
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Environment.Variables' \
            --output json)
          
          # Update environment variables with secrets and Function URL
          # SECURITY: Pass secrets directly from GitHub outputs to jq to avoid logging
          UPDATED_ENV=$(echo "$CURRENT_ENV" | jq \
            --arg hosts "api.deadpartymedia.com,${FUNCTION_URL_HOST}" \
            --arg db_pwd "${{ steps.secrets.outputs.db_password }}" \
            --arg secret_key "${{ steps.secrets.outputs.secret_key }}" \
            --arg aws_bucket "${{ steps.secrets.outputs.aws_storage_bucket_name }}" \
            '. + {
              ALLOWED_HOSTS: $hosts,
              DB_PASSWORD: $db_pwd,
              SECRET_KEY: $secret_key,
              AWS_STORAGE_BUCKET_NAME: $aws_bucket,
              AWS_S3_REGION_NAME: "us-east-1"
            }')
          
          # Add AWS credentials if they exist
          if [ -n "${{ steps.secrets.outputs.aws_access_key_id }}" ] && [ -n "${{ steps.secrets.outputs.aws_secret_access_key }}" ]; then
            UPDATED_ENV=$(echo "$UPDATED_ENV" | jq \
              --arg aws_key "${{ steps.secrets.outputs.aws_access_key_id }}" \
              --arg aws_secret "${{ steps.secrets.outputs.aws_secret_access_key }}" \
              '. + {
                AWS_ACCESS_KEY_ID: $aws_key,
                AWS_SECRET_ACCESS_KEY: $aws_secret
              }')
          else
            echo "Warning: AWS S3 credentials not found. S3 storage will not work." >&2
          fi
          
          # Update Lambda function environment
          aws lambda update-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --environment "Variables=${UPDATED_ENV}" \
            --output json
          
          echo "✅ Lambda environment variables updated"
          echo "   Function URL: ${FUNCTION_URL}"
          echo "   ALLOWED_HOSTS includes: api.deadpartymedia.com,${FUNCTION_URL_HOST}"

