name: Build and Deploy Container

# Required permissions for OIDC authentication with AWS
permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required to checkout code

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/server/**'
      - '.github/workflows/deploy-container.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: deadpartymedia-api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/server
        run: uv sync

      - name: Run tests
        working-directory: apps/server
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
          USE_S3: "False"
          SPOTIFY_CLIENT_ID: "test_client_id"
          SPOTIFY_CLIENT_SECRET: "test_client_secret"
        run: uv run pytest

  build-and-deploy:
    name: Build and Deploy to Lambda
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC (OpenID Connect)
      # This uses GitHub's OIDC provider to authenticate with AWS without storing static credentials
      # The IAM role must have a trust policy allowing GitHub Actions to assume it
      # See apps/server/IAM_POLICIES.md for required IAM permissions
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::992382618631:role/deadpartymedia-github-actions
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeadPartyMedia-${{ github.run_id }}
      
      - name: Verify AWS authentication
        run: |
          echo "Verifying AWS authentication..."
          aws sts get-caller-identity
          echo "✅ Successfully authenticated with AWS"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get ECR repository URL
        id: ecr-repo
        run: |
          REPO_URI=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)
          
          if [ -z "$REPO_URI" ] || [ "$REPO_URI" = "None" ]; then
            echo "Error: ECR repository '${{ env.ECR_REPOSITORY }}' not found" >&2
            exit 1
          fi
          
          # Extract registry URL (remove repository name from URI)
          # REPO_URI format: account.dkr.ecr.region.amazonaws.com/repo-name
          # Registry URL: account.dkr.ecr.region.amazonaws.com
          REGISTRY_URL=$(echo "$REPO_URI" | sed 's|/.*||')
          
          echo "repository_uri=$REPO_URI" >> $GITHUB_OUTPUT
          echo "registry_url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          echo "✅ ECR repository URL: $REPO_URI"
          echo "✅ ECR registry URL: $REGISTRY_URL"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login \
              --username AWS \
              --password-stdin ${{ steps.ecr-repo.outputs.registry_url }}
          echo "✅ Successfully logged in to ECR"

      - name: Build Docker image
        working-directory: apps/server
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          REPO_URI="${{ steps.ecr-repo.outputs.repository_uri }}"
          IMAGE_NAME="${REPO_URI}:${IMAGE_TAG}"
          LATEST_IMAGE="${REPO_URI}:latest"
          
          docker build -t "${IMAGE_NAME}" -t "${LATEST_IMAGE}" .
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "✅ Built Docker image: ${IMAGE_NAME}"

      - name: Push Docker image
        run: |
          REPO_URI="${{ steps.ecr-repo.outputs.repository_uri }}"
          IMAGE_NAME="${{ env.image_name }}"
          IMAGE_TAG="${{ env.image_tag }}"
          LATEST_IMAGE="${REPO_URI}:latest"
          
          echo "Pushing image: ${IMAGE_NAME}"
          docker push "${IMAGE_NAME}" || {
            echo "Error: Failed to push image ${IMAGE_NAME}" >&2
            exit 1
          }
          
          echo "Pushing latest tag: ${LATEST_IMAGE}"
          docker push "${LATEST_IMAGE}" || {
            echo "Error: Failed to push latest image" >&2
            exit 1
          }
          
          echo "✅ Successfully pushed both images to ECR"

      - name: Get secrets from AWS Secrets Manager
        id: secrets
        run: |
          # Function to get secret value or set empty
          get_secret() {
            local secret_id=$1
            local output_var=$2
            if aws secretsmanager describe-secret --secret-id "$secret_id" --region ${{ env.AWS_REGION }} &>/dev/null; then
              local value=$(aws secretsmanager get-secret-value \
                --secret-id "$secret_id" \
                --region ${{ env.AWS_REGION }} \
                --query SecretString --output text)
              echo "${output_var}=$value" >> $GITHUB_OUTPUT
            else
              echo "${output_var}=" >> $GITHUB_OUTPUT
              echo "Warning: Secret $secret_id not found. $output_var must be set manually." >&2
            fi
          }
          
          # Get database password (try new name first, fallback to old name)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/db-password --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/db-password" "db_password"
          else
            get_secret "deadpartymedia/database/password" "db_password"
          fi
          
          # Get Django SECRET_KEY (try new name first, fallback to old name)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/secret-key --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/secret-key" "secret_key"
          else
            get_secret "deadpartymedia/django/secret-key" "secret_key"
          fi
          
          # Get AWS S3 credentials (optional - only needed if Lambda function requires explicit credentials)
          # Note: If Lambda execution role has S3 permissions, these credentials may not be needed
          # These are stored in Secrets Manager (not GitHub Secrets) and are passed to Lambda as environment variables
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-access-key-id --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/aws-access-key-id" "aws_access_key_id"
          else
            get_secret "deadpartymedia/aws/access-key-id" "aws_access_key_id"
          fi
          
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-secret-access-key --region ${{ env.AWS_REGION }} &>/dev/null; then
            get_secret "deadpartymedia/aws-secret-access-key" "aws_secret_access_key"
          else
            get_secret "deadpartymedia/aws/secret-access-key" "aws_secret_access_key"
          fi
          
          # Get S3 bucket name (try multiple possible names)
          if aws secretsmanager describe-secret --secret-id deadpartymedia/aws-storage-bucket-name --region ${{ env.AWS_REGION }} &>/dev/null; then
            AWS_BUCKET=$(aws secretsmanager get-secret-value \
              --secret-id deadpartymedia/aws-storage-bucket-name \
              --region ${{ env.AWS_REGION }} \
              --query SecretString --output text)
            echo "aws_storage_bucket_name=$AWS_BUCKET" >> $GITHUB_OUTPUT
          elif aws secretsmanager describe-secret --secret-id deadpartymedia/aws/storage-bucket-name --region ${{ env.AWS_REGION }} &>/dev/null; then
            AWS_BUCKET=$(aws secretsmanager get-secret-value \
              --secret-id deadpartymedia/aws/storage-bucket-name \
              --region ${{ env.AWS_REGION }} \
              --query SecretString --output text)
            echo "aws_storage_bucket_name=$AWS_BUCKET" >> $GITHUB_OUTPUT
          else
            # Use default bucket name if secret doesn't exist
            echo "aws_storage_bucket_name=deadpartymedia-bucket" >> $GITHUB_OUTPUT
          fi

      - name: Get database connection details
        id: database
        run: |
          # Get database details from Lightsail
          set -euo pipefail
          
          DB_INFO=$(aws lightsail get-relational-database \
            --relational-database-name deadpartymediaDB \
            --region ${{ env.AWS_REGION }} \
            --query 'relationalDatabase.{endpoint:masterEndpoint.address,port:masterEndpoint.port,name:masterDatabaseName,user:masterUsername}' \
            --output json)
          
          # Validate that the API call succeeded and returned valid JSON
          if [ -z "$DB_INFO" ] || [ "$DB_INFO" = "null" ]; then
            echo "Error: Failed to retrieve database information from Lightsail" >&2
            exit 1
          fi
          
          # Extract values and validate they are not null or empty
          DB_HOST=$(echo "$DB_INFO" | jq -r '.endpoint // empty')
          DB_PORT=$(echo "$DB_INFO" | jq -r '.port // empty')
          DB_NAME=$(echo "$DB_INFO" | jq -r '.name // empty')
          DB_USER=$(echo "$DB_INFO" | jq -r '.user // empty')
          
          # Validate all required fields are present
          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "null" ]; then
            echo "Error: Database endpoint (DB_HOST) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "null" ]; then
            echo "Error: Database port (DB_PORT) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "null" ]; then
            echo "Error: Database name (DB_NAME) is missing or null" >&2
            exit 1
          fi
          
          if [ -z "$DB_USER" ] || [ "$DB_USER" = "null" ]; then
            echo "Error: Database user (DB_USER) is missing or null" >&2
            exit 1
          fi
          
          # Output validated values
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT
          
          echo "✅ Database connection details validated:"
          echo "   Host: $DB_HOST"
          echo "   Port: $DB_PORT"
          echo "   Name: $DB_NAME"
          echo "   User: $DB_USER"

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          
          FUNCTION_NAME="deadpartymedia-api"
          AWS_REGION="${{ env.AWS_REGION }}"
          IMAGE_URI="${{ env.image_name }}"
          
          echo "Updating Lambda function: ${FUNCTION_NAME}"
          echo "Image URI: ${IMAGE_URI}"
          
          # Update Lambda function with new image
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            --region "${AWS_REGION}" \
            --output json
          
          echo "✅ Lambda function code updated successfully"
          
          # Wait for function update to complete
          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}"
          
          echo "✅ Lambda function update completed"

      - name: Get Lambda Function URL
        id: lambda_url
        run: |
          FUNCTION_NAME="deadpartymedia-api"
          AWS_REGION="${{ env.AWS_REGION }}"
          
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --query 'FunctionUrl' \
            --output text)
          
          if [ -z "$FUNCTION_URL" ] || [ "$FUNCTION_URL" = "null" ]; then
            echo "Error: Failed to retrieve Lambda Function URL" >&2
            exit 1
          fi
          
          echo "function_url=${FUNCTION_URL}" >> $GITHUB_OUTPUT
          echo "✅ Lambda Function URL: ${FUNCTION_URL}"

      - name: Update Lambda environment variables
        # Only run if previous step succeeded (GitHub Actions default behavior)
        # Additional validation ensures FUNCTION_URL is non-empty
        run: |
          set -euo pipefail
          
          FUNCTION_NAME="deadpartymedia-api"
          AWS_REGION="${{ env.AWS_REGION }}"
          FUNCTION_URL="${{ steps.lambda_url.outputs.function_url }}"
          
          # Validate Function URL is present and non-empty
          if [ -z "$FUNCTION_URL" ] || [ "$FUNCTION_URL" = "null" ]; then
            echo "Error: Lambda Function URL is missing or invalid. Cannot update environment variables." >&2
            echo "This step depends on the 'Get Lambda Function URL' step completing successfully." >&2
            exit 1
          fi
          
          FUNCTION_URL_HOST=$(echo "${FUNCTION_URL}" | sed 's|https://||' | sed 's|/.*||')
          
          # Validate required secrets before proceeding
          DB_PASSWORD="${{ steps.secrets.outputs.db_password }}"
          SECRET_KEY="${{ steps.secrets.outputs.secret_key }}"
          
          if [ -z "$DB_PASSWORD" ]; then
            echo "Error: DB_PASSWORD secret not found. Deployment cannot proceed." >&2
            exit 1
          fi
          
          if [ -z "$SECRET_KEY" ]; then
            echo "Error: SECRET_KEY secret not found. Deployment cannot proceed." >&2
            exit 1
          fi
          
          # Get current environment variables
          # Handle null case: if Lambda has no environment variables, query returns null
          # Also handle case where Environment.Variables doesn't exist (returns empty string)
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Environment.Variables' \
            --output json 2>/dev/null || echo "null")
          
          # Update environment variables with secrets, database details, and Function URL
          # SECURITY: Pass secrets directly from GitHub outputs to jq to avoid logging
          # Use validated variables to ensure they're not empty
          # Database connection details are retrieved from Lightsail (not Secrets Manager)
          # Use `. // {}` to handle null CURRENT_ENV (when Lambda has no existing env vars)
          # Include base domains in ALLOWED_HOSTS for production
          UPDATED_ENV=$(echo "$CURRENT_ENV" | jq \
            --arg hosts "api.deadpartymedia.com,deadpartymedia.com,www.deadpartymedia.com,${FUNCTION_URL_HOST}" \
            --arg db_pwd "$DB_PASSWORD" \
            --arg secret_key "$SECRET_KEY" \
            --arg aws_bucket "${{ steps.secrets.outputs.aws_storage_bucket_name }}" \
            --arg db_host "${{ steps.database.outputs.db_host }}" \
            --arg db_port "${{ steps.database.outputs.db_port }}" \
            --arg db_name "${{ steps.database.outputs.db_name }}" \
            --arg db_user "${{ steps.database.outputs.db_user }}" \
            '. // {} | . + {
              DJANGO_SETTINGS_MODULE: "config.settings.production",
              USE_S3: "True",
              ALLOWED_HOSTS: $hosts,
              DB_PASSWORD: $db_pwd,
              SECRET_KEY: $secret_key,
              AWS_STORAGE_BUCKET_NAME: $aws_bucket,
              AWS_S3_REGION_NAME: "us-east-1",
              DB_HOST: $db_host,
              DB_PORT: $db_port,
              DB_NAME: $db_name,
              DB_USER: $db_user,
              DB_SSLMODE: "require"
            }')
          
          # Add AWS credentials if they exist
          if [ -n "${{ steps.secrets.outputs.aws_access_key_id }}" ] && [ -n "${{ steps.secrets.outputs.aws_secret_access_key }}" ]; then
            UPDATED_ENV=$(echo "$UPDATED_ENV" | jq \
              --arg aws_key "${{ steps.secrets.outputs.aws_access_key_id }}" \
              --arg aws_secret "${{ steps.secrets.outputs.aws_secret_access_key }}" \
              '. + {
                AWS_ACCESS_KEY_ID: $aws_key,
                AWS_SECRET_ACCESS_KEY: $aws_secret
              }')
          else
            echo "Warning: AWS S3 credentials not found. S3 storage will not work." >&2
          fi
          
          # Update Lambda function environment
          # Use --cli-input-json to properly handle JSON with special characters
          # This prevents shell word splitting on spaces, quotes, commas, etc.
          echo "$UPDATED_ENV" | jq '{Environment: {Variables: .}}' > /tmp/lambda_env.json
          
          aws lambda update-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --cli-input-json file:///tmp/lambda_env.json \
            --output json
          
          # Clean up temporary file
          rm -f /tmp/lambda_env.json
          
          echo "✅ Lambda environment variables updated"
          echo "   Function URL: ${FUNCTION_URL}"
          echo "   ALLOWED_HOSTS includes: api.deadpartymedia.com,${FUNCTION_URL_HOST}"

