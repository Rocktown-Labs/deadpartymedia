name: Backend Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-2
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: apps/server
        run: |
          uv sync

      - name: Run tests
        working-directory: apps/server
        run: |
          uv run pytest --cov=content --cov=users --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/server/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            apps/server/htmlcov/
            apps/server/coverage.xml

  deploy:
    name: Deploy to Lightsail
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          pip install boto3 paramiko

      - name: Fetch secrets from AWS Secrets Manager
        id: fetch-secrets
        run: |
          python3 << 'PYTHON_SCRIPT'
          import boto3
          import json
          import os
          
          secrets_client = boto3.client('secretsmanager', region_name='us-east-2')
          
          # Fetch all required secrets
          secrets = {}
          secret_names = [
              'deadpartymedia/lightsail/instance-ip',
              'deadpartymedia/lightsail/ssh-private-key',
              'deadpartymedia/database/endpoint',
              'deadpartymedia/database/port',
              'deadpartymedia/database/username',
              'deadpartymedia/database/password',
              'deadpartymedia/database/name',
              'deadpartymedia/django/secret-key',
              'deadpartymedia/django/allowed-hosts',
              # Optional secrets (will be None if not found)
              'deadpartymedia/aws/access-key-id',
              'deadpartymedia/aws/secret-access-key',
              'deadpartymedia/aws/storage-bucket-name',
              'deadpartymedia/aws/s3-region',
              'deadpartymedia/email/resend-api-key',
              'deadpartymedia/sentry/dsn',
              'deadpartymedia/spotify/client-id',
              'deadpartymedia/spotify/client-secret',
          ]
          
          env_file = os.environ.get('GITHUB_ENV')
          if not env_file:
              env_file = '/tmp/github_env'
          
          for secret_name in secret_names:
              try:
                  response = secrets_client.get_secret_value(SecretId=secret_name)
                  secret_value = response['SecretString']
                  
                  # Store in environment variable (sanitize name)
                  env_name = secret_name.replace('/', '_').replace('-', '_').upper()
                  
                  # For multiline values (like SSH keys), handle differently
                  if 'ssh-private-key' in secret_name:
                      # Write SSH key to file
                      with open('/tmp/ssh_key.pem', 'w') as f:
                          f.write(secret_value)
                      os.chmod('/tmp/ssh_key.pem', 0o600)
                      with open(env_file, 'a') as f:
                          f.write('SSH_KEY_PATH=/tmp/ssh_key.pem\n')
                  else:
                      # Escape special characters for environment variable
                      escaped_value = secret_value.replace('\n', '\\n').replace('"', '\\"').replace('$', '\\$')
                      with open(env_file, 'a') as f:
                          f.write(f'{env_name}={escaped_value}\n')
                  
                  secrets[secret_name] = secret_value
                  print(f"Fetched secret: {secret_name}")
              except Exception as e:
                  # Optional secrets - don't fail if they don't exist
                  if 'aws' in secret_name or 'email' in secret_name or 'sentry' in secret_name or 'spotify' in secret_name:
                      print(f"Optional secret not found (skipping): {secret_name}")
                      secrets[secret_name] = None
                  else:
                      print(f"Error fetching required secret {secret_name}: {e}")
                      exit(1)
          
          # Export as JSON for easier access
          with open('/tmp/secrets.json', 'w') as f:
              json.dump(secrets, f)
          
          print("All secrets fetched successfully")
          PYTHON_SCRIPT

      - name: Verify Lightsail instance status
        run: |
          python3 << 'PYTHON_SCRIPT'
          import boto3
          import sys
          import os
          
          lightsail = boto3.client('lightsail', region_name='us-east-2')
          
          # Get instance details
          instance_name = os.environ.get('LIGHTSAIL_INSTANCE_NAME', 'deadparty-server')
          try:
              response = lightsail.get_instance(instanceName=instance_name)
              state = response['instance']['state']['name']
              print(f"Instance state: {state}")
              
              if state != 'running':
                  print(f"ERROR: Instance is not running (state: {state})")
                  sys.exit(1)
              print("Instance is running and ready for deployment")
          except Exception as e:
              print(f"Error checking instance: {e}")
              sys.exit(1)
          PYTHON_SCRIPT
        env:
          LIGHTSAIL_INSTANCE_NAME: deadparty-server

      - name: Deploy to Lightsail instance
        run: |
          # Read instance IP from environment (set by fetch-secrets step)
          INSTANCE_IP="${DEADPARTYMEDIA_LIGHTSAIL_INSTANCE_IP:-18.224.61.135}"
          SSH_USER="bitnami"
          APP_DIR="/home/bitnami/deadpartymedia"
          
          # Copy deployment script to instance
          scp -i $SSH_KEY_PATH \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              apps/server/deploy-lightsail.sh \
              $SSH_USER@$INSTANCE_IP:/tmp/deploy-lightsail.sh
          
          # Execute deployment script on instance with environment variables
          ssh -i $SSH_KEY_PATH \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              $SSH_USER@$INSTANCE_IP \
              "chmod +x /tmp/deploy-lightsail.sh && \
               DB_HOST='$DEADPARTYMEDIA_DATABASE_ENDPOINT' \
               DB_PORT='$DEADPARTYMEDIA_DATABASE_PORT' \
               DB_NAME='$DEADPARTYMEDIA_DATABASE_NAME' \
               DB_USER='$DEADPARTYMEDIA_DATABASE_USERNAME' \
               DB_PASSWORD='$DEADPARTYMEDIA_DATABASE_PASSWORD' \
               SECRET_KEY='$DEADPARTYMEDIA_DJANGO_SECRET_KEY' \
               ALLOWED_HOSTS='$DEADPARTYMEDIA_DJANGO_ALLOWED_HOSTS' \
               AWS_ACCESS_KEY_ID='${DEADPARTYMEDIA_AWS_ACCESS_KEY_ID:-}' \
               AWS_SECRET_ACCESS_KEY='${DEADPARTYMEDIA_AWS_SECRET_ACCESS_KEY:-}' \
               AWS_STORAGE_BUCKET_NAME='${DEADPARTYMEDIA_AWS_STORAGE_BUCKET_NAME:-}' \
               AWS_S3_REGION_NAME='${DEADPARTYMEDIA_AWS_S3_REGION:-us-east-1}' \
               RESEND_API_KEY='${DEADPARTYMEDIA_EMAIL_RESEND_API_KEY:-}' \
               SENTRY_DSN='${DEADPARTYMEDIA_SENTRY_DSN:-}' \
               SENTRY_ENVIRONMENT='production' \
               SPOTIFY_CLIENT_ID='${DEADPARTYMEDIA_SPOTIFY_CLIENT_ID:-}' \
               SPOTIFY_CLIENT_SECRET='${DEADPARTYMEDIA_SPOTIFY_CLIENT_SECRET:-}' \
               USE_S3='True' \
               /tmp/deploy-lightsail.sh"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/ssh_key.pem /tmp/secrets.json

