[project]
name = "server"
version = "0.1.0"
description = "Dead Party Media Django Backend"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.9",
    "djangorestframework>=3.16.1",
    "django-allauth>=65.13.1",
    "django-jazzmin>=3.0.1",
    "django-storages>=1.14.6",
    "django-ckeditor>=6.7.3",
    "boto3>=1.42.22",
    "psycopg2-binary>=2.9.11",
    "pillow>=12.1.0",
    "django-cors-headers>=4.9.0",
    "requests>=2.32.5",
    "python-dotenv>=1.0.0",
    "sentry-sdk[django]>=2.48.0",
    "spotipy>=2.4.0",
    "pytest-django>=4.8.0",
    "factory-boy>=3.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "content", "users"]
