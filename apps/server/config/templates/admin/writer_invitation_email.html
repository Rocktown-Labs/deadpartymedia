<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #0A0A0A;
            color: #7CFC00;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 20px;
            background-color: #f9f9f9;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #7CFC00;
            color: #000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin: 20px 0;
        }
        .footer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dead Party Media</h1>
    </div>
    <div class="content">
        <h2>Welcome, {{ writer.name }}!</h2>
        <p>You've been added as a writer to {{ site_name }}.</p>
        <p>You can now log in to create and manage your articles and events.</p>
        <p>
            <a href="{{ login_url }}" class="button">Log In to Your Account</a>
        </p>
        <p>If you have any questions, please contact us.</p>
    </div>
    <div class="footer">
        <p>This is an automated message from {{ site_name }}.</p>
    </div>
</body>
</html>
